name: Testes de Automacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar browsers
        run: playwright install --with-deps chromium
      - name: Correr testes API
        run: pytest tests/api/ -m api --tb=short --alluredir=allure-results
      - name: Correr testes UI
        if: always()
        run: pytest tests/ui/ -m ui --tb=short --alluredir=allure-results
      - name: Instalar Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline
      - name: Gerar relatorio Allure
        if: always()
        run: allure generate allure-results --clean -o allure-report