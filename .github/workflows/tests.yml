name: Testes de Automacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar browsers
        run: playwright install --with-deps chromium

      - name: Correr testes API
        run: pytest tests/api/ -m api --tb=short --alluredir=allure-results

      - name: Correr testes UI
        if: always()
        run: pytest tests/ui/ -m ui --tb=short --alluredir=allure-results

      - name: Instalar Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline

      - name: Gerar relatorio Allure
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Publicar relatorio como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Enviar email com resultado
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "Testes de Automacao - ${{ job.status }}"
          to: ${{ secrets.GMAIL_USER }}
          from: ${{ secrets.GMAIL_USER }}
          body: |
            Pipeline: ${{ job.status }}
            Repositorio: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Ver detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}